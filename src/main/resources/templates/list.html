<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
  <span class="brand">🌾 Farm Produce Traceability Portal</span>
  <div class="links">
    <a th:href="@{/produce}">All batches</a>
    <a th:if="${canAdd}" th:href="@{/produce/new}">Add batch</a>
    <a th:if="${isAdmin}" th:href="@{/dashboard}">Dashboard</a>
    <span class="userbox">Logged in as <b th:text="${username}"></b> (<span th:text="${role}"></span>)</span>
    <form th:action="@{/logout}" method="post" class="logout-form">
      <button type="submit" class="btn btn-light" id="logout">Logout</button>
    </form>
  </div>
</nav>

<main class="container">
  <h1>Produce Batches</h1>
  <p id="msg" class="alert" th:if="${msg}" th:text="${msg}"></p>

  <form class="search" th:action="@{/produce}" method="get">
    <input name="q" th:value="${q}" placeholder="Search by name or farm"/>
    <button type="submit" id="search">Search</button>
  </form>

  <div class="card">
    <table>
      <tr><th>ID</th><th>Name</th><th>Farm</th><th>Harvest date</th><th>Status</th><th>Actions</th></tr>
      <tr th:if="${#lists.isEmpty(items)}">
        <td colspan="6" class="empty">No batches found.</td>
      </tr>
      <tr th:each="p : ${items}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.farm}"></td>
        <td th:text="${p.harvestDate}"></td>
        <td><span class="badge" th:classappend="${'badge-' + p.status}" th:text="${p.status}"></span></td>
        <td>
          <div class="actions">
            <a class="btn btn-light" th:if="${canAdd}" th:href="@{/produce/{id}/edit(id=${p.id})}">Edit</a>
            <form th:action="@{/produce/{id}/advance(id=${p.id})}" method="post"
                  th:if="${(role == 'ADMIN' and p.status.name() != 'AT_RETAIL') or (role == 'DISTRIBUTOR' and p.status.name() == 'HARVESTED') or (role == 'RETAILER' and p.status.name() == 'IN_TRANSIT')}">
              <button type="submit" class="advance">Advance</button>
            </form>
            <form th:if="${isAdmin}" th:action="@{/produce/{id}/status(id=${p.id})}" method="post">
              <select name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == p.status}"></option>
              </select>
              <button type="submit" class="set-status">Set status</button>
            </form>
          </div>
        </td>
      </tr>
    </table>
  </div>
</main>
</body>
</html>
