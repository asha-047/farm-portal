<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Dashboard</title></head>
<body>
<h1>Dashboard</h1>
<p>Total: <span th:text="${total}"></span></p>
<ul>
  <li>Harvested: <span th:text="${harvested}"></span></li>
  <li>In transit: <span th:text="${inTransit}"></span></li>
  <li>At retail: <span th:text="${atRetail}"></span></li>
</ul>
<p><a th:href="@{/produce}">Back</a></p>
</body>
</html>
