<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
  <span class="brand">🌾 Farm Produce Traceability Portal</span>
  <div class="links">
    <a th:href="@{/produce}">All batches</a>
    <a th:href="@{/produce/new}">Add batch</a>
    <a th:href="@{/dashboard}">Dashboard</a>
  </div>
</nav>

<main class="container">
  <h1>Dashboard</h1>
  <div class="stats">
    <div class="stat total">
      <div class="stat-number" th:text="${total}">0</div>
      <div class="stat-label">Total batches</div>
    </div>
    <div class="stat">
      <div class="stat-number" th:text="${harvested}">0</div>
      <div class="stat-label">Harvested</div>
    </div>
    <div class="stat">
      <div class="stat-number" th:text="${inTransit}">0</div>
      <div class="stat-label">In transit</div>
    </div>
    <div class="stat">
      <div class="stat-number" th:text="${atRetail}">0</div>
      <div class="stat-label">At retail</div>
    </div>
  </div>
</main>
</body>
</html>
